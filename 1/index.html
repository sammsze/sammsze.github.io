<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Strategy Presentation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
    }

    /* Section 1: Project #0 */
    .section-1 {
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .section-1 h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Section 2: Selfie Intro */
    .section-2 {
      height: 80vh;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 10%;
    }
    .section-2 h2 {
      font-size: clamp(3.5rem, 9vw, 7rem);
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .section-2 p {
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: #cccccc;
      margin-top: 10px;
    }

    /* Section 3: Two Column Comparison */
    .section-3 {
      min-height: 100vh;
      padding: 100px 8%;
      background-color: #ffffff;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 40px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .img-placeholder {
      background-color: #e0e0e0;
      aspect-ratio: 4 / 3;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .caption {
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #000000;
      line-height: 1.4;
    }

    /* Section 4: Dolly Zoom Full Width Hero */
    .section-4 {
      position: relative;
      height: 100vh;
      border: 16px solid #ffde00; /* Yellow framing border */
      margin: 40px;
    }
    .section-4 .hero-img {
      width: 100%;
      height: 100%;
      background-color: #d8d8d8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .section-4 .overlay-text {
      position: absolute;
      bottom: 60px;
      left: 60px;
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      font-weight: 900;
      line-height: 1;
      color: #000000;
      text-transform: uppercase;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .section-4 {
        margin: 15px;
        border-width: 8px;
      }
      .section-4 .overlay-text {
        bottom: 30px;
        left: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- Section 1 -->
  <section class="section-1">
    <h1>PROJECT #0</h1>
  </section>

  <!-- Section 2 -->
  <section class="section-2">
    <h2>SELFIE:</h2>
    <p>the wrong way vs the right way</p>
  </section>

  <!-- Section 3 -->
  <section class="section-3">
    <div class="grid-container">
      <div class="card">
        <div class="img-placeholder">Image Placeholder (001)</div>
        <div class="caption">
          ARCHITECTURAL<br>
          PERSPECTIVE<br>
          COMPRESSION<br>
          (001)
        </div>
      </div>
      <div class="card">
        <div class="img-placeholder">Image Placeholder (002)</div>
        <div class="caption">
          ARCHITECTURAL<br>
          PERSPECTIVE<br>
          COMPRESSION<br>
          (002)
        </div>
      </div>
    </div>
  </section>

  <!-- Section 4 -->
  <section class="section-4">
    <div class="hero-img">Full-Bleed Image Placeholder</div>
    <div class="overlay-text">
      THE<br>DOLLY ZOOM
    </div>
  </section>

</body>
</html>
