<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project #0 Submission</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
    }

    /* Section 1 */
    .section-1 {
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      text-align: center;
      padding: 0 20px;
    }
    .section-1 h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .section-1 p {
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: #cccccc;
      letter-spacing: 1px;
    }

    /* Section 2 */
    .section-2 {
      min-height: 100vh;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 8%;
      gap: 30px;
    }
    .image-row {
      display: flex;
      gap: 15px;
      width: 100%;
    }
    .img-card {
      width: 20%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row-img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 4px;
    }
    .img-caption {
      font-size: 0.85rem;
      color: #cccccc;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .section-2 h2 {
      font-size: clamp(3.5rem, 9vw, 7rem);
      text-transform: uppercase;
      letter-spacing: 3px;
      line-height: 1;
    }
    .section-2 p {
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: #cccccc;
    }

    /* Section 3 */
    .section-3 {
      min-height: 100vh;
      padding: 100px 8%;
      background-color: #ffffff;
    }
    .section-3-header {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 40px;
      color: #000000;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 40px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }
    .caption {
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #000000;
      line-height: 1.4;
    }

    /* Section 4 */
    .section-4 {
      min-height: 100vh;
      background-color: #ffde00; /* Yellow background */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 30px;
    }
    .gif-wrapper {
      width: 50%;
      max-width: 1080px;
      aspect-ratio: 1 / 1; /* Enforces 1080x1080 square ratio */
      background-color: #000000;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .section-4 .hero-gif {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .section-4 .overlay-text {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      line-height: 1;
      color: #000000;
      text-transform: uppercase;
      text-align: center;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .image-row {
        flex-wrap: wrap;
      }
      .img-card {
        width: calc(50% - 10px);
      }
      .gif-wrapper {
        width: 100%;
      }
      .section-4 {
        margin: 15px;
        border-width: 8px;
      }
      .section-4 .overlay-text {
        padding: 30px;
      }
    }
  </style>
</head>
<body>

  <section class="section-1">
    <h1>PROJECT #0</h1>
    <p>becoming friends with your camera</p>
  </section>

  <section class="section-2">
    <div class="image-row">
      <div class="img-card">
        <img src="7.0x.jpg" alt="7x zoom" class="row-img">
        <span class="img-caption">7.0x Zoom</span>
      </div>
      <div class="img-card">
        <img src="5.0x.jpg" alt="5x zoom" class="row-img">
        <span class="img-caption">5.0x Zoom</span>
      </div>
      <div class="img-card">
        <img src="3.0x.jpg" alt="3x zoom" class="row-img">
        <span class="img-caption">3.0x Zoom</span>
      </div>
      <div class="img-card">
        <img src="1.0x.jpg" alt="1x zoom" class="row-img">
        <span class="img-caption">1.0x Zoom</span>
      </div>
      <div class="img-card">
        <img src="0.5x.jpg" alt="0.5x zoom" class="row-img">
        <span class="img-caption">0.5x Zoom</span>
      </div>
    </div>
    <h2>SELFIE:</h2>
    <p>the wrong way vs the right way</p>
  </section>

  <section class="section-3">
    <h2 class="section-3-header">ARCHITECTURAL PERSPECTIVE COMPRESSION</h2>
    <div class="grid-container">
      <div class="card">
        <img src="furtherdist.jpg" alt="photo from a further distance" class="card-img">
        <div class="caption">
          from a further distance
        </div>
      </div>
      <div class="card">
        <img src="nearerdist.jpg" alt="photo from a nearer distance" class="card-img">
        <div class="caption">
          from a nearer distance
        </div>
      </div>
    </div>
  </section>

  <section class="section-4">
    <div class="gif-wrapper">
      <img src="download.gif" alt="The Dolly Zoom GIF" class="hero-gif">
    </div>
    <h2 class="overlay-text">
      THE DOLLY ZOOM
    </h2>
  </section>

</body>
</html>
