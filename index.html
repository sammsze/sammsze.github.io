<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS180 Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 8%;
    }

    /* Header Section */
    header {
      margin-top: 40px;
    }

    header h1 {
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1.05;
    }

    header p {
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      color: #cccccc;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Projects Grid Section */
    .projects-container {
      margin: 60px 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .project-card {
      background-color: #111111;
      border: 3px solid #ffde00; /* Signature yellow accent border */
      padding: 40px 30px;
      text-decoration: none;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-5px);
      background-color: #ffde00;
      color: #000000;
    }

    .project-card .project-number {
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.8;
    }

    .project-card .project-title {
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    /* Footer Section */
    footer {
      border-top: 1px solid #333333;
      padding-top: 20px;
      color: #666666;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>CS180 PORTFOLIO</h1>
    <p>intro to computer vision & computational photography</p>
  </header>

  <!-- Main Content: Projects Grid -->
  <main class="projects-container">
    <a href="./1/index.html" class="project-card">
      <span class="project-number">PROJECT #0</span>
      <span class="project-title">BECOMING FRIENDS WITH YOUR CAMERA</span>
    </a>
    
    <!-- Future projects can be added using the same card layout -->
  </main>

  <!-- Footer -->
  <footer>
    <p>UC BERKELEY CS180</p>
  </footer>

</body>
</html>
